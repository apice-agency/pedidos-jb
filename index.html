<style>
:root{--red:#f50a00;--red-d:#c40800;--bg:#f4f4f4;--txt:#1b1b1b;--mut:#6b6b6b;--line:#dcdcdc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font-family:inherit}
header{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:60px;height:60px;border-radius:50%;background:#fff;padding:3px}
.brand h1{font-size:26px;margin:0;line-height:1.1}
.brand small{opacity:.9;font-size:15px;display:block;margin-top:2px}
.cfg{margin-left:auto;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:28px;width:54px;height:54px;border-radius:50%}
.tabs{display:flex;margin-top:10px;gap:6px}
.tabs button{flex:1;border:0;background:transparent;color:#fff;font-size:19px;font-weight:700;padding:15px 0;border-radius:14px 14px 0 0;opacity:.9}
.tabs button.on{background:var(--bg);color:var(--red);opacity:1}
.badge{display:inline-block;background:#fff;color:var(--red);border-radius:14px;font-size:16px;padding:1px 8px;margin-left:4px}
.tabs button.on .badge{background:var(--red);color:#fff}
main{padding:14px 14px 190px;max-width:760px;margin:auto}
.search,.cli{width:100%;font-size:26px;padding:18px;border:3px solid var(--line);border-radius:16px;outline:0;background:#fff}
.search:focus,.cli:focus{border-color:var(--red)}
label{display:block;font-size:20px;font-weight:700;margin:4px 2px 8px}
.hint{color:var(--mut);font-size:19px;margin:10px 2px}
h2{font-size:24px;margin:26px 2px 4px;color:var(--red)}
.item{background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.item.on{border-color:var(--red);background:#fff4f3}
.cod{font-size:19px;color:var(--red);font-weight:800}
.desc{font-size:24px;line-height:1.25;word-break:break-word;margin-top:2px}
.step{display:flex;gap:10px;margin-top:12px;align-items:center}
.b{flex:1;height:68px;border:3px solid var(--red);background:#fff;color:var(--red);font-size:42px;font-weight:700;border-radius:14px;line-height:1}
.b.p{background:var(--red);color:#fff}
.b:active{opacity:.6}
.b:disabled{border-color:var(--line);color:#bbb;background:#f6f6f6}
.n{min-width:96px;text-align:center;font-size:34px;font-weight:800;padding:10px 4px;border-radius:12px;background:#f0f0f0}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:10px;z-index:6}
.sum{flex:1 1 100%;font-size:21px;color:var(--mut)}
.sum b{color:var(--txt)}
.done,.go{flex:1;border:0;background:var(--red);color:#fff;font-size:26px;font-weight:800;padding:20px 16px;border-radius:16px}
.done:active,.go:active{background:var(--red-d)}
.done:disabled,.go:disabled{background:#ccc}
.ghost{border:3px solid var(--line);background:#fff;color:var(--mut);padding:18px 20px;border-radius:16px;font-size:22px;font-weight:700}
.empty{text-align:center;color:var(--mut);padding:50px 10px;font-size:22px}
.toast{position:fixed;left:50%;bottom:210px;transform:translateX(-50%);background:#222;color:#fff;padding:14px 22px;border-radius:26px;font-size:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:92%;text-align:center}
.toast.on{opacity:1}
.rf{display:block;width:100%;font-size:24px;padding:18px}
.err{color:var(--red);font-weight:700}
.fh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.arr{font-size:26px;color:var(--red)}
.fl{display:flex;gap:10px;align-items:baseline;border-top:2px solid var(--line);padding:12px 2px;margin-top:2px}
.fc2{color:var(--red);font-weight:800;font-size:22px;min-width:80px}
.fd{flex:1;font-size:19px;word-break:break-word}
.fq{font-weight:800;font-size:28px;white-space:nowrap}
.fb{display:block;width:100%;margin-top:14px;flex:none}
.item{position:relative}
.add{display:block;width:100%;margin-top:12px;height:72px;border:0;border-radius:14px;background:var(--red);color:#fff;font-size:34px;font-weight:800}
.add:active{background:var(--red-d)}
.in{color:#1e9e3a}
.rm{position:absolute;top:6px;right:6px;width:52px;height:52px;border:0;background:transparent;font-size:28px;color:#999}
.pk .desc{padding-right:44px}
.chk{width:68px;height:68px;flex:none;border:3px solid #bbb;background:#fff;border-radius:14px;font-size:40px;color:#fff;line-height:1}
.chk.on{background:#1e9e3a;border-color:#1e9e3a}
.item.ok{border-color:#1e9e3a;background:#effaf1}
.item.ok .desc{color:var(--mut);text-decoration:line-through}
[hidden]{display:none!important}

.price-result{border:2px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;background:#fff}
.price-result .price-name{font-size:19px;font-weight:750;margin:8px 0}
.price-result .price-code{color:var(--red);font-weight:800}
.price-values{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.price-value{background:#f4f4f4;border-radius:10px;padding:12px}
.price-value small{display:block;color:var(--mut);font-size:13px;margin-bottom:6px}
.price-value strong{font-size:20px}
</style>
</head>

  <div class="tabs">
    <button id="t1" class="on">Buscar</button>
    <button id="t2">Pedido<span class="badge" id="cnt">0</span></button>

<main>
  <section id="v1">
    <input id="q" class="search" type="search" placeholder="Escribí el artículo…" autocomplete="off" autocapitalize="none" spellcheck="false">
    <div class="hint" id="hint"></div>
    <div id="res"></div>
  </section>
  <section id="v2" hidden>
    <label for="cli">Nombre del cliente (opcional)</label>
    <input id="cli" class="cli" type="text" placeholder="Ej: Pérez">
    <div id="ord"></div>
  </section>
  <section id="v3" hidden>
    <button class="ghost rf" id="rf">↻ Actualizar</button>
    <div class="hint err" id="fmsg"></div>
    <div id="fact"></div>
  </section>
  <section id="v4" hidden>
    <input id="pq" class="search" type="search" placeholder="Buscar por código o nombre…" autocomplete="off" autocapitalize="none" spellcheck="false">
    <div class="hint" id="phint">Cargando precios desde precios.xlsx…</div>
    <div id="pres"></div>
  </section>
</main>
<div class="bar" id="bar">
  <div class="sum" id="sum" hidden></div>
  <button class="go" id="go">Ver pedido ›</button>
  <button class="ghost" id="clr" hidden>Vaciar</button>
  <button class="done" id="ok" disabled hidden>Pedido realizado</button>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
let PRICE_DATA=[];
let DATA=[];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/["'´`]/g,'');
let IDX=[];
const $=id=>document.getElementById(id);
let order=[];
try{order=JSON.parse(localStorage.getItem('pedido')||'[]');$('cli').value=localStorage.getItem('cliente')||''}catch(e){}
const save=()=>{try{localStorage.setItem('pedido',JSON.stringify(order));localStorage.setItem('cliente',$('cli').value)}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>0?n:0};
const qOf=c=>{const f=order.find(o=>o.c==c);return f?f.q:0};
let fact=[],openId='',loadingF=false,errF='';
const DESC={};
function jsonp(params,cb){
  var dest='';try{dest=localStorage.getItem('destino')||''}catch(e){}
  if(!dest){cb(null,'Primero conectá con la PC (botón ⚙).');return}
  var nm='jp'+Date.now()+Math.floor(Math.random()*1000),s=document.createElement('script'),done=false,tm;
  var end=function(r,er){if(done)return;done=true;clearTimeout(tm);try{delete window[nm]}catch(e){window[nm]=undefined}if(s.parentNode)s.parentNode.removeChild(s);cb(r,er)};
  tm=setTimeout(function(){end(null,'Google no respondió. Revisá internet y que el script esté actualizado (versión nueva).')},20000);
  window[nm]=function(r){end(r)};
  s.onerror=function(){end(null,'No se pudo conectar con Google.')};
  s.src=dest+(dest.indexOf('?')<0?'?':'&')+'callback='+nm+'&'+params+'&_='+Date.now();
  document.head.appendChild(s);
}
function loadF(silent){
  if(loadingF)return;loadingF=true;if(!silent){errF='';renderFact()}
  jsonp('action=list',function(r,er){
    loadingF=false;
    if(!r||!r.ok){errF=er||(r&&r.error)||'Respuesta inválida.'}
    else{
      errF='';
      fact=r.items.map(function(x){
        var its=String(x.text||'').split(/\r?\n/).filter(Boolean).map(function(l){var a=l.split(';');return {c:a[0],q:a[1],d:DESC[a[0]]||''}});
        var cli=x.cli||String(x.name||'').replace(/^pedido_\d{8}_\d{4}_?/,'').replace(/\.txt$/,'').replace(/_/g,' ');
        return {id:x.id,t:x.t,cli:cli,items:its};
      });
    }
    renderFact();
  });
}
function renderFact(){
  $('fcnt').textContent=fact.length;
  $('rf').textContent=loadingF?'Actualizando…':'↻ Actualizar';
  $('fmsg').textContent=errF;
  const p=n=>('0'+n).slice(-2);
  $('fact').innerHTML=fact.length?fact.map(f=>{
    const d=new Date(f.t),open=f.id==openId;
    return `<div class="item${open?' on':''}"><div class="fh" data-f="${f.id}" data-a="f"><div><div class="desc"><b>${esc(f.cli||'Consumidor final')}</b></div><div class="cod">${p(d.getDate())}/${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())} · ${f.items.length} artículo(s)</div></div><span class="arr">${open?'▲':'▼'}</span></div>`
      +(open?f.items.map(i=>`<div class="fl"><span class="fc2">${esc(i.c)}</span><span class="fd">${esc(i.d)}</span><span class="fq">× ${esc(String(i.q))}</span></div>`).join('')+`<button class="done fb" data-f="${f.id}" data-a="fd">Facturado ✔</button>`:'')+'</div>';
  }).join(''):(loadingF?'<div class="empty">Cargando…</div>':(errF?'':'<div class="empty">No hay pedidos para facturar.</div>'));
}
function factClick(id,a){
  if(a=='f'){openId=openId==id?'':id;renderFact();return}
  const f=fact.find(x=>x.id==id);
  if(!f||!confirm('¿Marcar como facturado y quitar de la lista?\n\n'+(f.cli||'Consumidor final')))return;
  jsonp('action=done&id='+encodeURIComponent(id),function(r,er){
    if(r&&r.ok){fact=fact.filter(x=>x.id!=id);openId='';renderFact();toast('✔ Facturado')}
    else alert('No se pudo marcar como facturado. '+(er||(r&&r.error)||'')+'\nProbá de nuevo.');
  });
}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
function rowB(c,d,q){
  return `<div class="item${q?' on':''}"><div class="cod">${c}${q?' · <span class="in">✔ En pedido ×'+q+'</span>':''}</div><div class="desc">${esc(d)}</div><button class="add" data-c="${c}" data-a="+">+ Agregar</button></div>`;
}
function rowP(o){
  const k=o.k,c=o.c;
  return `<div class="item pk${k?' ok':''}"><button class="rm" data-c="${c}" data-a="x">✕</button><div class="cod">${c}</div><div class="desc">${esc(o.d)}</div><div class="step"><button class="b" data-c="${c}" data-a="-"${o.q>1?'':' disabled'}>−</button><span class="n" data-c="${c}" data-a="n">${o.q}</span><button class="b p" data-c="${c}" data-a="+">+</button><button class="chk${k?' on':''}" data-c="${c}" data-a="k">${k?'✔':''}</button></div></div>`;
}
function chg(c,a){
  const f=order.find(o=>o.c==c);
  const it=IDX.find(x=>x.c==c);
  if(a=='+'){if(f)f.q+=1;else order.push({c:it.c,d:it.d,q:1,k:false})}
  else if(a=='-'&&f){if(f.q>1)f.q-=1}
  else if(a=='k'&&f){f.k=!f.k}
  else if(a=='x'&&f){if(confirm('¿Quitar este artículo del pedido?\n\n'+f.d))order=order.filter(o=>o.c!=c)}
  else if(a=='n'){
    const v=prompt('Cantidad (0 para quitar):',f?f.q:1);if(v===null)return;
    const q=num(v);
    if(q){if(f)f.q=q;else order.push({c:it.c,d:it.d,q,k:false})}else if(f)order=order.filter(o=>o.c!=c);
  }
  save();upd();
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;if(b.dataset.f)factClick(b.dataset.f,b.dataset.a);else chg(+b.dataset.c,b.dataset.a)});
$('q').addEventListener('input',upd);
$('cli').addEventListener('input',save);
function upd(){
  const units=order.reduce((s,o)=>s+o.q,0);
  $('cnt').textContent=order.length;
  const listos=order.filter(o=>o.k).length;
  $('sum').innerHTML=`<b>${listos}</b> de <b>${order.length}</b> listos · <b>${+units.toFixed(2)}</b> unidades`;
  $('ok').disabled=!order.length;
  $('go').disabled=!order.length;
  $('go').textContent='Ver pedido ('+order.length+') ›';
  const toks=norm($('q').value).split(/\s+/).filter(Boolean);
  if(!toks.length){$('res').innerHTML='';$('hint').textContent=DATA.length+' artículos. Empezá a escribir…'}
  else{
    const f=IDX.filter(it=>toks.every(t=>it.n.includes(t)));
    $('hint').textContent=f.length?(f.length>20?'Mostrando 20 de '+f.length+'. Escribí más para afinar.':f.length+' resultado(s)'):'Sin resultados';
    $('res').innerHTML=f.slice(0,20).map(it=>rowB(it.c,it.d,qOf(it.c))).join('');
  }
  renderFact();
  $('ord').innerHTML=order.length?order.map(rowP).join(''):'<div class="empty">Todavía no cargaste artículos.<br>Andá a “Buscar” para empezar.</div>';
}
function tab(n,nf){
  $('v1').hidden=n!=1;$('v2').hidden=n!=2;$('v3').hidden=n!=3;$('v4').hidden=n!=4;
  [1,2,3,4].forEach(k=>$('t'+k).classList.toggle('on',n==k));
  $('bar').hidden=n==3||n==4;
  $('go').hidden=n!=1;$('sum').hidden=$('clr').hidden=$('ok').hidden=n!=2;
  window.scrollTo(0,0);
  if(n==3)loadF();
  if(n==4&& !PRICE_DATA.length)loadPrices();
  if(n==1&&!nf)$('q').focus();
}
$('t1').onclick=()=>tab(1);$('rf').onclick=()=>loadF();$('t2').onclick=()=>tab(2);$('t3').onclick=()=>tab(3);$('t4').onclick=()=>tab(4);$('go').onclick=()=>tab(2);
$('clr').onclick=()=>{if(order.length&&confirm('¿Vaciar todo el pedido?')){order=[];save();upd()}};
$('ok').onclick=function(){
  try{
  if(!order.length)return;
  var falt=order.filter(function(o){return !o.k}).length;
  if(!confirm((falt?'Hay '+falt+' artículo(s) sin tildar.\n\n':'')+'¿Pedido realizado? Se guardará el listado y se vaciará el pedido.'))return;
  var txt=order.map(function(o){return o.c+';'+o.q}).join('\r\n')+'\r\n';
  var d=new Date(),p=function(n){return ('0'+n).slice(-2)};
  var cli=norm($('cli').value).replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
  var name='pedido_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+(cli?'_'+cli:'')+'.txt';
  var dest='';try{dest=localStorage.getItem('destino')||''}catch(e){}
  var fin=function(m){setTimeout(loadF,3000);order=[];$('cli').value='';save();$('ok').textContent='Pedido realizado';upd();tab(1);toast(m)};
  var local=function(){
    try{
      var url=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));
      var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url)},4000);
    }catch(e){alert('No se pudo descargar el archivo. Copiá este listado y guardalo:\n\n'+txt)}
  };
  var fail=function(why){local();fin('No se pudo enviar a la PC');alert('NO se envió a la PC. El archivo se descargó en el equipo.\n\nMotivo: '+why)};
  if(!dest){local();fin('Descargado en el equipo: '+name);return}
  $('ok').disabled=true;$('ok').textContent='Enviando…';
  var body=JSON.stringify({name:name,text:txt,cli:$('cli').value.trim()});
  if(window.fetch){
    fetch(dest,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body})
      .then(function(){fin('✔ Enviado a la PC: '+name)},function(){fail('no hay conexión con Google (revisá internet o la URL).')});
  }else{
    var x=new XMLHttpRequest(),end=false;
    var h=function(){if(end)return;end=true;(navigator.onLine===false)?fail('sin internet.'):fin('✔ Enviado a la PC: '+name)};
    x.onload=h;x.onerror=h;x.timeout=20000;x.ontimeout=function(){if(!end){end=true;fail('Google no respondió a tiempo.')}};
    x.open('POST',dest);x.setRequestHeader('Content-Type','text/plain;charset=utf-8');x.send(body);
  }
  }catch(er){$('ok').disabled=false;$('ok').textContent='Pedido realizado';alert('Error inesperado: '+(er&&er.message||er)+'\n\nAnotá este mensaje y avisá.')}
};
$('cfg').onclick=()=>{
  const v=prompt('Pegá la URL de conexión con la PC (Google Drive).\nDejá vacío para guardar solo en el celular.',localStorage.getItem('destino')||'');
  if(v===null)return;
  const u=v.replace(/\s+/g,'');
  if(u&&!/^https:\/\/.+\/exec(\?.*)?$/.test(u)&&!confirm('La URL no termina en /exec, así que quizás no funcione.\n\n¿Guardarla igual?'))return;
  try{localStorage.setItem('destino',u)}catch(e){alert('Este navegador no permite guardar la configuración. Abrí el archivo con Chrome.')}
  est();toast(u?'Conectado con la PC':'Se guardará solo en el celular');
};
function est(){let d='';try{d=localStorage.getItem('destino')||''}catch(e){}$('est').textContent=d?'✔ Conectado a la PC':'Solo guarda en el celular (⚙ para conectar)'}

function money(v){
  if(v===null||v===undefined||v==='')return '—';
  let n=typeof v==='number'?v:Number(String(v).replace(/\s/g,'').replace(/\./g,'').replace(',','.'));
  return Number.isFinite(n)?'$ '+n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
}
let pricesLoading=false;
function loadPrices(){
  if(pricesLoading||PRICE_DATA.length)return;
  pricesLoading=true;
  $('phint').textContent='Cargando precios.xlsx…';
  fetch('precios.xlsx?_='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('No se encontró precios.xlsx junto al HTML.');return r.arrayBuffer()}).then(function(buf){
    if(!window.XLSX)throw new Error('No se pudo cargar el lector de Excel. Revisá la conexión a internet.');
    const wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
    let header=-1;
    for(let i=0;i<Math.min(rows.length,80);i++){if(rows[i].some(v=>norm(String(v||'')).trim()==='codigo')){header=i;break}}
    if(header<0)throw new Error('No encontré la fila de encabezados que contiene “Código”.');
    let cat='';PRICE_DATA=[];
    for(let i=header+1;i<rows.length;i++){
      const r=rows[i]||[],code=String(r[0]??'').trim(),desc=String(r[1]??'').trim();
      if(!code&&desc){cat=desc;continue}
      if(!/^\d+(?:\.0+)?$/.test(code)||!desc)continue;
      const c=code.replace(/\.0+$/,'');
      PRICE_DATA.push({c,d:desc,pres:String(r[2]??'').trim(),sin:r[3],con:r[4],cat,n:norm(c+' '+desc)});
    }
    DATA=PRICE_DATA.map(p=>[p.c,p.d]);
    IDX=DATA.map(([c,d])=>({c,d,n:norm(c+' '+d)}));
    Object.keys(DESC).forEach(k=>delete DESC[k]);
    DATA.forEach(function(r){DESC[r[0]]=r[1]});
    pricesLoading=false;
    $('phint').textContent=PRICE_DATA.length+' productos cargados desde precios.xlsx.';
    upd();
    renderPrices();
  }).catch(function(e){pricesLoading=false;$('phint').textContent='No se pudieron cargar los productos desde precios.xlsx: '+(e.message||e)+' Colocá precios.xlsx en la misma carpeta que la aplicación y abrila desde un sitio web (por ejemplo Netlify).';$('hint').textContent='No se pudieron cargar los productos. Revisá precios.xlsx.';});
}
function renderPrices(){
  const q=norm($('pq').value||'').trim();
  if(!PRICE_DATA.length){$('pres').innerHTML='';return}
  if(!q){$('pres').innerHTML='';$('phint').textContent=PRICE_DATA.length+' productos disponibles. Escribí un código o nombre para consultar.';return}
  const toks=q.split(/\s+/).filter(Boolean),found=PRICE_DATA.filter(p=>toks.every(t=>p.n.includes(t))).slice(0,30);
  $('phint').textContent=found.length?(found.length+' resultado(s)'+(found.length===30?' · mostrando hasta 30':'')):'No se encontraron productos.';
  $('pres').innerHTML=found.map(p=>`<div class="price-result"><div class="price-code">Código ${esc(p.c)}</div><div class="price-name">${esc(p.d)}</div>${p.cat?`<div class="hint">${esc(p.cat)}</div>`:''}<div class="price-values"><div class="price-value"><small>Precio sin IVA</small><strong>${money(p.sin)}</strong></div><div class="price-value"><small>Precio con IVA</small><strong>${money(p.con)}</strong></div></div></div>`).join('');
}
$('pq').addEventListener('input',renderPrices);
est();upd();tab(1,1);loadPrices();loadF(1);setInterval(function(){if(!$('v3').hidden)loadF(1)},60000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
