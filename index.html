<style>
:root{--red:#f50a00;--red-d:#c40800;--bg:#f4f4f4;--card:#fff;--txt:#1b1b1b;--mut:#6b6b6b;--line:#e3e3e3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:42px;height:42px;border-radius:50%;background:#fff;padding:2px}
.brand h1{font-size:18px;margin:0;line-height:1.1}
.cfg{margin-left:auto;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px;width:40px;height:40px;border-radius:50%}
.brand small{opacity:.85;font-size:12px}
.tabs{display:flex;margin-top:8px;gap:4px}
.tabs button{flex:1;border:0;background:transparent;color:#fff;font-size:15px;font-weight:600;padding:11px 0;border-radius:10px 10px 0 0;opacity:.85}
.tabs button.on{background:var(--bg);color:var(--red);opacity:1}
.badge{display:inline-block;background:#fff;color:var(--red);border-radius:10px;font-size:12px;padding:1px 7px;margin-left:4px}
.tabs button.on .badge{background:var(--red);color:#fff}
main{padding:12px 12px 110px;max-width:720px;margin:auto}
.search{width:100%;font-size:18px;padding:14px;border:2px solid var(--line);border-radius:12px;outline:0;background:#fff}
.search:focus{border-color:var(--red)}
.hint{color:var(--mut);font-size:13px;margin:8px 2px}
.item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.info{flex:1;min-width:0}
.cod{font-size:12px;color:var(--red);font-weight:700}
.desc{font-size:15px;line-height:1.25;word-break:break-word}
.qty{width:62px;font-size:17px;text-align:center;padding:10px 4px;border:2px solid var(--line);border-radius:10px;background:#fff}
.qty:focus{border-color:var(--red);outline:0}
.add{border:0;background:var(--red);color:#fff;font-size:22px;font-weight:700;width:46px;height:46px;border-radius:10px}
.add:active,.done:active{background:var(--red-d)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:38px;height:42px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:20px;font-weight:700;color:var(--red)}
.del{border:0;background:transparent;color:var(--mut);font-size:22px;width:36px;height:42px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:6}
.sum{font-size:13px;color:var(--mut);flex:1;line-height:1.3}
.sum b{color:var(--txt);font-size:15px}
.done{border:0;background:var(--red);color:#fff;font-size:16px;font-weight:700;padding:14px 18px;border-radius:12px}
.done:disabled{background:#ccc}
.ghost{border:2px solid var(--line);background:#fff;color:var(--mut);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600}
.cli{width:100%;font-size:16px;padding:12px;border:2px solid var(--line);border-radius:12px;margin-bottom:4px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%;text-align:center}
.toast.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/["'´`]/g,'');
const IDX=DATA.map(([c,d])=>({c,d,n:c+' '+norm(d)}));
const $=id=>document.getElementById(id);
let order=[];
try{order=JSON.parse(localStorage.getItem('pedido')||'[]');$('cli').value=localStorage.getItem('cliente')||''}catch(e){}
const save=()=>{try{localStorage.setItem('pedido',JSON.stringify(order));localStorage.setItem('cliente',$('cli').value)}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>0?n:0};
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600)}

function search(){
  const toks=norm($('q').value).split(/\s+/).filter(Boolean);
  const res=$('res');
  if(!toks.length){res.innerHTML='';$('hint').textContent=DATA.length+' artículos en la lista. Empezá a escribir…';return}
  const f=IDX.filter(it=>toks.every(t=>it.n.includes(t)));
  $('hint').textContent=f.length?(f.length>40?'Mostrando 40 de '+f.length+'. Afiná la búsqueda.':f.length+' resultado(s)'):'Sin resultados';
  res.innerHTML=f.slice(0,40).map(it=>`<div class="item"><div class="info"><div class="cod">${it.c}</div><div class="desc">${esc(it.d)}</div></div><input class="qty" inputmode="decimal" placeholder="Cant." value="1" data-c="${it.c}"><button class="add" data-c="${it.c}">+</button></div>`).join('');
}
function add(c,q){
  const it=IDX.find(x=>x.c==c);const f=order.find(o=>o.c==c);
  if(f)f.q+=q;else order.push({c:it.c,d:it.d,q});
  save();upd();toast('Agregado: '+q+' × '+it.d.slice(0,28));
}
$('res').addEventListener('click',e=>{
  const b=e.target.closest('.add');if(!b)return;
  const inp=b.parentNode.querySelector('.qty');const q=num(inp.value);
  if(!q){toast('Poné una cantidad');inp.focus();return}
  add(+b.dataset.c,q);$('q').value='';search();$('q').focus();
});
$('res').addEventListener('focusin',e=>{if(e.target.classList.contains('qty'))e.target.select()});
$('q').addEventListener('input',search);

function renderOrder(){
  $('ord').innerHTML=order.length?order.map((o,i)=>`<div class="item"><div class="info"><div class="cod">${o.c}</div><div class="desc">${esc(o.d)}</div></div><div class="step"><button data-i="${i}" data-a="-">−</button><input class="qty" inputmode="decimal" value="${o.q}" data-i="${i}"><button data-i="${i}" data-a="+">+</button></div><button class="del" data-i="${i}" data-a="x">✕</button></div>`).join(''):'<div class="empty">Todavía no cargaste artículos.<br>Andá a “Buscar” para empezar.</div>';
}
$('ord').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i,a=b.dataset.a;
  if(a=='+')order[i].q+=1;else if(a=='-')order[i].q=Math.max(1,order[i].q-1);else order.splice(i,1);
  save();upd();
});
$('ord').addEventListener('change',e=>{
  if(!e.target.classList.contains('qty'))return;
  const i=+e.target.dataset.i,q=num(e.target.value);
  if(q)order[i].q=q;else order.splice(i,1);
  save();upd();
});
$('cli').addEventListener('input',save);

function upd(){
  const units=order.reduce((s,o)=>s+o.q,0);
  $('cnt').textContent=order.length;
  $('sum').innerHTML=`<b>${order.length}</b> artículo(s)<br>${+units.toFixed(2)} unidades`;
  $('ok').disabled=!order.length;
  renderOrder();
}
function tab(n){
  $('v1').hidden=n!=1;$('v2').hidden=n!=2;
  $('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);
  if(n==1)$('q').focus();
}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
$('clr').onclick=()=>{if(order.length&&confirm('¿Vaciar todo el pedido?')){order=[];save();upd()}};
$('ok').onclick=function(){
  try{
  if(!order.length)return;
  if(!confirm('¿Pedido realizado? Se guardará el listado y se vaciará el pedido.'))return;
  var txt=order.map(function(o){return o.c+';'+o.q}).join('\r\n')+'\r\n';
  var d=new Date(),p=function(n){return ('0'+n).slice(-2)};
  var cli=norm($('cli').value).replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
  var name='pedido_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+(cli?'_'+cli:'')+'.txt';
  var dest='';try{dest=localStorage.getItem('destino')||''}catch(e){}
  var fin=function(m){order=[];$('cli').value='';save();$('ok').textContent='Pedido realizado';upd();tab(1);toast(m)};
  var local=function(){
    try{
      var url=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));
      var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url)},4000);
    }catch(e){alert('No se pudo descargar el archivo. Copiá este listado y guardalo:\n\n'+txt)}
  };
  var fail=function(why){local();fin('No se pudo enviar a la PC');alert('NO se envió a la PC. El archivo se descargó en el equipo.\n\nMotivo: '+why)};
  if(!dest){local();fin('Descargado en el equipo: '+name);return}
  $('ok').disabled=true;$('ok').textContent='Enviando…';
  var body=JSON.stringify({name:name,text:txt});
  if(window.fetch){
    fetch(dest,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body})
      .then(function(){fin('✔ Enviado a la PC: '+name)},function(){fail('no hay conexión con Google (revisá internet o la URL).')});
  }else{
    var x=new XMLHttpRequest(),end=false;
    var h=function(){if(end)return;end=true;(navigator.onLine===false)?fail('sin internet.'):fin('✔ Enviado a la PC: '+name)};
    x.onload=h;x.onerror=h;x.timeout=20000;x.ontimeout=function(){if(!end){end=true;fail('Google no respondió a tiempo.')}};
    x.open('POST',dest);x.setRequestHeader('Content-Type','text/plain;charset=utf-8');x.send(body);
  }
  }catch(er){$('ok').disabled=false;$('ok').textContent='Pedido realizado';alert('Error inesperado: '+(er&&er.message||er)+'\n\nAnotá este mensaje y avisá.')}
};
$('cfg').onclick=()=>{
  const v=prompt('Pegá la URL de conexión con la PC (Google Drive).\nDejá vacío para guardar solo en el celular.',localStorage.getItem('destino')||'');
  if(v===null)return;
  const u=v.replace(/\s+/g,'');
  if(u&&!/^https:\/\/.+\/exec(\?.*)?$/.test(u)&&!confirm('La URL no termina en /exec, así que quizás no funcione.\n\n¿Guardarla igual?'))return;
  try{localStorage.setItem('destino',u)}catch(e){alert('Este navegador no permite guardar la configuración. Abrí el archivo con Chrome.')}
  est();toast(u?'Conectado con la PC':'Se guardará solo en el celular');
};
function est(){let d='';try{d=localStorage.getItem('destino')||''}catch(e){}$('est').textContent=d?'✔ Conectado a la PC':'Solo guarda en el celular (⚙ para conectar)'}
est();upd();search();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
